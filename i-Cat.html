<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i-cat</title>
    <style>
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo {
            height: 10vh; /* 使用相對單位vh來適應行動裝置 */
            width: 100%;
        }
        .rounded-button {
            display: inline-block;
            padding: 10px 20px;
            font-size: 1.2em; /* 適用於手機的字體大小 */
            color: #fff;
            background-color: #007bff;
            border: 3px solid #0056b3;
            border-radius: 25px;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .rounded-button:hover {
            background-color: #0056b3;
        }
        .sms {
            margin-bottom: 10px;
        }
        input[type="tel"] {
            padding: 10px;
            font-size: 1.2em;
            margin-bottom: 10px;
            border: 2px solid #ccc;
            border-radius: 5px;
        }
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <!-- 這裡可以放置logo -->
        </div>
        <div class="content">
            <input type="tel" id="phoneNumber" placeholder="輸入電話號碼">
            <div class="sms">
                <a class="rounded-button" id="sendLink1" href="#">Send 管理室</a>
            </div>
            <div class="sms">
                <a class="rounded-button" id="sendLink2" href="#">Send 不在家</a>
            </div>
            <ul>
              <li><a href="intent:#Intent;action=android.settings.WIFI_SETTINGS;end">Wi-Fi 設定</a></li>
              <li><a href="intent:#Intent;action=android.settings.BLUETOOTH_SETTINGS;end">藍牙設定</a></li>
              <li><a href="intent:#Intent;action=android.settings.APPLICATION_SETTINGS;end">應用程式管理</a></li>
              <li><a href="intent:#Intent;action=android.settings.DEVELOPMENT_SETTINGS;end">開發者選項（已啟用）</a></li>
              <li><a href="intent:#Intent;action=android.settings.DISPLAY_SETTINGS;end">顯示設定</a></li>
              <li><a href="intent:#Intent;action=android.settings.SOUND_SETTINGS;end">音量/聲音設定</a></li>
              <li><a href="intent:#Intent;action=android.settings.LOCALE_SETTINGS;end">語言與輸入法設定</a></li>
              <li><a href="intent:#Intent;action=android.settings.DEVICE_INFO_SETTINGS;end">關於平板/裝置</a></li>
              <li><a href="intent:#Intent;action=android.settings.SECURITY_SETTINGS;end">安全性設定</a></li>
              <li><a href="intent:#Intent;action=android.settings.DATE_SETTINGS;end">日期時間設定</a></li>
              <li><a href="intent:#Intent;action=android.settings.ACCESSIBILITY_SETTINGS;end">存取性設定（無障礙）</a></li>
              <li><a href="intent:#Intent;action=android.settings.MANAGE_DEFAULT_APPS_SETTINGS;end">預設應用程式設定頁</a></li>
              <li><a href="intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.HOME;end">主畫面選擇（啟動器設定）</a></li>
              <li><a href="intent:#Intent;action=android.settings.NOTIFICATION_SETTINGS;end">通知設定（全部）</a></li>
              <li><a href="intent:#Intent;action=android.settings.IGNORE_BATTERY_OPTIMIZATION_SETTINGS;end">電池優化設定</a></li>
              <li><a href="intent:#Intent;action=android.settings.MANAGE_UNKNOWN_APP_SOURCES;end">安裝未知來源 App 設定</a></li>
              <li><a href="intent:#Intent;action=android.settings.APP_NOTIFICATION_SETTINGS;end">應用通知設定（特定 App）</a></li>
              <li><a href="intent:#Intent;action=android.settings.DATA_USAGE_SETTINGS;end">資料用量（行動與 Wi-Fi）</a></li>
              <li><a href="intent:#Intent;action=android.settings.MANAGE_DEFAULT_APPS_SETTINGS;end">預設應用程式設定</a></li>
              <li><a href="intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.HOME;end">設定主畫面（啟動器）</a></li>
            </ul>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function(){
            $('#sendLink1').click(function() {
                var phoneNumber = $('#phoneNumber').val();
                if (phoneNumber) {
                    var message = '尊敬的客戶，\n\n您的包裹已經送達管理室，請您方便時前來領取。\n\n我是黑貓宅急便。\n\n謝謝！';
                    $(this).attr('href', 'tel:' + phoneNumber);
                    navigator.clipboard.writeText(message).then(function() {
                        alert('短信內容已複製到剪貼板');
                    }, function(err) {
                        console.error('無法複製短信內容: ', err);
                    });
                }
            });

            $('#sendLink2').click(function() {
                var phoneNumber = $('#phoneNumber').val();
                if (phoneNumber) {
                    var message = '尊敬的客戶，\n\n您好！由於無法送達，您的包裹需要與我們聯繫安排後續事宜。\n\n黑貓宅急便。\n\n感謝您的支持與配合！';
                    $(this).attr('href', 'tel:' + phoneNumber);
                    navigator.clipboard.writeText(message).then(function() {
                        alert('短信內容已複製到剪貼板');
                    }, function(err) {
                        console.error('無法複製短信內容: ', err);
                    });
                }
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圓角連結按鈕</title>
    <style>
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .rounded-button {
            display: inline-block;
            padding: 10px 20px;
            font-size: 1.2em; /* 適用於手機的字體大小 */
            color: #fff;
            background-color: #007bff;
            border: 3px solid #0056b3;
            border-radius: 25px;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .rounded-button:hover {
            background-color: #0056b3;
        }
        .sms {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sms">
            <a class="rounded-button" href="sms://?&body=尊敬的客戶，%0A%0A您的包裹已經送達管理室，請您方便時前來領取。%0A%0A我是黑貓宅急便。%0A%0A謝謝！">Send 管理室</a>
        </div>
        <div class="sms">
            <a class="rounded-button" href="sms://?&body=尊敬的客戶，%0A%0A您好！由於無法送達，您的包裹需要與我們聯繫安排後續事宜。%0A%0A黑貓宅急便。%0A%0A感謝您的支持與配合！">Send 不在家</a>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function(){
            // 這裡可以添加您的jQuery代碼
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i-cat</title>
    <style>
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo {
            height: 10vh; /* 使用相對單位vh來適應行動裝置 */
            width: 100%;
        }
        .rounded-button {
            display: inline-block;
            padding: 10px 20px;
            font-size: 1.2em; /* 適用於手機的字體大小 */
            color: #fff;
            background-color: #007bff;
            border: 3px solid #0056b3;
            border-radius: 25px;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .rounded-button:hover {
            background-color: #0056b3;
        }
        .sms {
            margin-bottom: 10px;
        }
        input[type="tel"] {
            padding: 10px;
            font-size: 1.2em;
            margin-bottom: 10px;
            border: 2px solid #ccc;
            border-radius: 5px;
        }
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <!-- 這裡可以放置logo -->
        </div>
        <div class="content">
            <input type="tel" id="phoneNumber" placeholder="輸入電話號碼">
            <div class="sms">
                <a class="rounded-button" id="sendLink1" href="#">Send 管理室</a>
            </div>
            <div class="sms">
                <a class="rounded-button" id="sendLink2" href="#">Send 不在家</a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function(){
            $('#sendLink1').click(function() {
                var phoneNumber = $('#phoneNumber').val();
                if (phoneNumber) {
                    var message = '尊敬的客戶，\n\n您的包裹已經送達管理室，請您方便時前來領取。\n\n我是黑貓宅急便。\n\n謝謝！';
                    $(this).attr('href', 'tel:' + phoneNumber);
                    navigator.clipboard.writeText(message).then(function() {
                        alert('短信內容已複製到剪貼板');
                    }, function(err) {
                        console.error('無法複製短信內容: ', err);
                    });
                }
            });

            $('#sendLink2').click(function() {
                var phoneNumber = $('#phoneNumber').val();
                if (phoneNumber) {
                    var message = '尊敬的客戶，\n\n您好！由於無法送達，您的包裹需要與我們聯繫安排後續事宜。\n\n黑貓宅急便。\n\n感謝您的支持與配合！';
                    $(this).attr('href', 'tel:' + phoneNumber);
                    navigator.clipboard.writeText(message).then(function() {
                        alert('短信內容已複製到剪貼板');
                    }, function(err) {
                        console.error('無法複製短信內容: ', err);
                    });
                }
            });
        });
    </script>
</body>
</html>
